  topic.huawei.collective_communication_unit: Collective Communication Unit (CCU)；Atlas 950资料中的集合通信硬件加速单元。
  topic.huawei.direct_tcp_offload_engine: Direct TCP Offload Engine (DTOE)；鲲鹏官方词表中的华为网络卸载技术。
