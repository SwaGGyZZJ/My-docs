  topic.abi: Binary interfaces, calling conventions and layout contracts
  topic.cli: Command-line interfaces and options
  topic.protocol: Message formats, state transitions and communication contracts
  topic.configuration: Configuration fields, defaults and effective scope
  topic.data_model: Data schemas, formats and integrity constraints
  topic.storage: Persistence, filesystems, databases and data durability
  topic.network: Networking mechanisms and constraints
