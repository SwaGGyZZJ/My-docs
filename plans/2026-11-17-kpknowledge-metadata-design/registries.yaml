  topic.kunpeng.protocol_adapter: Protocol Adapter (PA)；鲲鹏CPU语境中的片间协议适配单元。
  topic.kunpeng.raid_dif_engine: RAID DIF Engine (RDE)；鲲鹏语境中的RAID DIF计算加速引擎。
  topic.kunpeng.high_performance_rsa_engine: High Performance RSA Engine (HPRE)；鲲鹏旧KAE资料语境中的RSA加速模块。
  topic.kunpeng.security_engine: Security Engine (SEC)；鲲鹏旧KAE资料语境中的安全加速模块。
  # 华为共享/相邻生态，不标记成鲲鹏专有。
