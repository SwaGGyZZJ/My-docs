# 设计稿 v2，未接入运行时。technology 为技术体系或独立技术，module 为有明确技术关联的组件。
# module 使用结构化登记项，其余 registry 使用 token -> description。
# module.technology 为目录关联；parent 需来源支持，禁止循环；点号前缀不产生父子关系。
# 分类不授予适用性、兼容性或独占归属，不从父页或整本手册继承。
# 全称为主体；有歧义的官方展开按来源上下文保留。未明确关联的历史单元暂留 topic。
domains:
  systems: Software systems and implementation mechanisms
  semiconductors: Semiconductor devices, chip design, verification, integration and enablement
  software_engineering: Requirements, design, construction, testing, maintenance and quality
  data_ai: Data engineering, datasets, models, machine learning and agent systems
  security: Security mechanisms, weaknesses, vulnerabilities and supply-chain assurance
  operations: Deployment, observability, reliability and incident response
  engineering_collaboration: Engineering decisions, processes, responsibilities and economics
technology:
  generic: Mechanisms not limited to a named programming stack
  c: C language interfaces and implementation
  cpp: C++ language interfaces and implementation
  python: Python language interfaces and implementation
  rust: Rust language interfaces and implementation
  go: Go language interfaces and implementation
  java: Java language interfaces and implementation
  javascript: JavaScript language interfaces and implementation
  typescript: TypeScript language interfaces and implementation
  assembly: Assembly language and instruction-level implementation
  sql: SQL queries, data definitions and constraints
  shell: Shell commands and scripts
  verilog: Verilog hardware description and modeling
  systemverilog: SystemVerilog hardware description, assertions and verification
  vhdl: VHDL hardware description and modeling
  tcl: Tcl scripting for design automation and tool control
  spice: SPICE circuit descriptions and simulation models
  # 全称来源：华为灵衢发布说明与openEuler 24.03 LTS SP3指南。
  # https://www.huawei.com/cn/news/2025/9/hc-xu-keynote-speech
  # https://docs.openeuler.org/zh/docs/24.03_LTS_SP3/unifiedbus/unifiedbus/urma/URMA%20User%20Guide.ch.html
  unified_bus: UnifiedBus (UB)；灵衢；华为共享及开放互联生态，不限于鲲鹏。
  ub_over_ethernet: UB over Ethernet (UBoE)；Atlas 950资料中的以太网上UB互联。
  # 官方组件/框架全称；不把开放框架登记为鲲鹏独占技术。
  # https://github.com/kunpengcompute/KAE/blob/kae2/README.md
  # https://www.hikunpeng.com/document/detail/en/kunpenggrf/gls/kunpengglossary_0000_01.html
  user_space_accelerator_development_kit: User Space Accelerator Development Kit (UADK)；用户态加速器开发包；开放加速器框架。
  kunpeng_accelerator_engine: Kunpeng Accelerator Engine (KAE)；鲲鹏加速引擎；采用官方项目正文名称，不由旧材料中的Acceleration写法另建产品。
  kunpeng_math_library: Kunpeng Math Library (KML)；鲲鹏数学库。
  kunpeng_unified_parallel_library: Kunpeng Unified Parallel Library (KUPL)；鲲鹏统一并行加速库。
  hyper_message_passing_interface: Hyper Message Passing Interface (HMPI / Hyper MPI)；鲲鹏HPCKit并行通信组件。
  kunpeng_unified_acceleration_framework: Kunpeng Unified Acceleration Framework (KUAF)；鲲鹏统一加速框架。
  kunpeng_online_vectorized_analysis_engine: Kunpeng Online Vectorized Analysis Engine (KOVAE)；鲲鹏数据库可插拔在线向量化分析引擎。
  kunpeng_hyper_media_performance_primitives: Kunpeng Hyper Media Performance Primitives (HMPP)；鲲鹏超媒体性能库；官方也使用不带Kunpeng前缀的名称。
  kunpeng_system_library: Kunpeng System Library (KSL)；鲲鹏系统库。
  hyper_thread_library: Hyper Thread Library (HTL)；鲲鹏系统库中的轻量级线程库。
  kunpeng_data_processing_and_acceleration_kit: Kunpeng Data Processing & Acceleration Kit (DPAK)；鲲鹏DPU及SmartNIC生态数据处理加速套件。
  data_acceleration_kit: Data Acceleration Kit (DA Kit)；鲲鹏部件及计算模组生态的数据加速套件。
  # HPCKit组件全称以官方安装输出为依据，不从Ku*缩写猜测。
  # https://www.hikunpeng.com/document/detail/en/kunpenghpcs/hpckit/instg/KunpengHPCKit_install_020.html
  kunpeng_hyper_io_middleware: Kunpeng Hyper IO Middleware (HIO)；鲲鹏HPCKit科学数据IO中间件。
  kunpeng_lithography_library: Kunpeng Lithography Library (KuLitho)；鲲鹏计算光刻加速库。
  kunpeng_unified_quantum_chromodynamics_library: Kunpeng Unified Quantum Chromodynamics Library (KuQCD)；鲲鹏量子色动力学加速库。
  kunpeng_unified_transformer_accelerator: Kunpeng Unified Transformer Accelerator (KuTACC)；鲲鹏Transformer加速组件。
  kunpeng_unified_reverse_time_migration: Kunpeng Unified Reverse Time Migration (KuRTM)；鲲鹏逆时偏移加速组件。
  kunpeng_unified_deep_neural_networks: Kunpeng Unified Deep Neural Networks (KuDNN)；鲲鹏深度神经网络加速组件。
  kunpeng_quick_malloc: Kunpeng Quick Malloc (KQMalloc)；鲲鹏软件生态中的内存分配库。
  homogeneous_acceleration_framework: Homogeneous Acceleration Framework (HAF)；鲲鹏软件生态中的同构加速框架。
  heterogeneous_communication_acceleration_library: Heterogeneous Communication Acceleration Library (HCAL)；UB Service Core架构参考设计2.0中的异构通信加速库。
  hyper_communication_library: Hyper Communication Library (HCOM)；UB Service Core架构参考设计2.0中的通信库；不自动归一为其他文档中的HCOMM。
  virtual_kunpeng_accelerator_engine: virtual Kunpeng Accelerator Engine (vKAE)；鲲鹏虚拟化加速方案；virtual保留官方名称写法。
module:
  unified_bus.to_ethernet:
    name: UB to Ethernet
    description: UB to Ethernet (UB2E)；Atlas 950资料中的UB到以太网转换桥。
    technology: unified_bus
    kind: bridge
    sources:
      - uri: https://support.huaweicloud.com/resmgmt-modelarts/resmgmt-a5_0002.html
        revision: Atlas 950 product context
  unified_bus.unified_remote_memory_access:
    name: Unified Remote Memory Access
    description: Unified Remote Memory Access (URMA)；统一远程内存访问；开放UB通信生态。
    technology: unified_bus
    kind: software_component
    sources:
      - uri: https://docs.openeuler.org/zh/docs/24.03_LTS_SP3/unifiedbus/unifiedbus/urma/URMA%20User%20Guide.ch.html
        revision: 24.03 LTS SP3
  unified_bus.memory_based_socket:
    name: UB Memory-based Socket
    description: UB Memory-based Socket (UMS)；openEuler UB组件；与标准Socket兼容的网络协议栈。
    technology: unified_bus
    kind: software_component
    sources:
      - uri: https://docs.openeuler.org/en/docs/24.03_LTS_SP3/server/releasenotes/releasenotes/key_features.html
        revision: 24.03 LTS SP3
  unified_bus.management:
    name: UnifiedBus Management
    description: UnifiedBus Management (UBM)；UB Service Core架构参考设计2.0中的管理组件。
    technology: unified_bus
    kind: software_component
    sources:
      - uri: https://www.openeuler.org/projects/ub-service-core/white-paper/UB-Service-Core-SW-Arch-RD-2.0-en.pdf
        revision: Software Architecture Reference Design 2.0
  unified_bus.unified_lock:
    name: Unified Lock
    description: Unified Lock (ULOCK)；openEuler 24.03 LTS SP3中文指南中的分布式锁组件名称。
    technology: unified_bus
    kind: software_component
    sources:
      - uri: https://docs.openeuler.org/zh/docs/24.03_LTS_SP3/unifiedbus/unifiedbus/urma/URMA%20User%20Guide.ch.html
        revision: 24.03 LTS SP3
  unified_bus.unified_socket:
    name: Unified Socket
    description: Unified Socket (USOCK)；openEuler 24.03 LTS SP3中文指南中的Socket组件名称。
    technology: unified_bus
    kind: software_component
    sources:
      - uri: https://docs.openeuler.org/zh/docs/24.03_LTS_SP3/unifiedbus/unifiedbus/urma/URMA%20User%20Guide.ch.html
        revision: 24.03 LTS SP3
  unified_bus.processing_unit:
    name: UB Processing Unit
    description: UB Processing Unit (UBPU)；UB Root Table规范1.0中的UB处理单元。
    technology: unified_bus
    kind: hardware_unit
    sources:
      - uri: https://www.unifiedbus.com/static/UB-Root-Table-Spec-1.0-en.pdf
        revision: "1.0"
  unified_bus.bus_controller:
    name: UB Bus Controller
    description: UB Bus Controller (UBC)；UB Root Table规范1.0中的总线控制器。
    technology: unified_bus
    kind: hardware_unit
    sources:
      - uri: https://www.unifiedbus.com/static/UB-Root-Table-Spec-1.0-en.pdf
        revision: "1.0"
  kunpeng_accelerator_engine.kunpeng_security_engine:
    name: Kunpeng Security Engine
    description: Kunpeng Security Engine (kSEC)；鲲鹏安全加速引擎。
    technology: kunpeng_accelerator_engine
    kind: hardware_unit
    sources:
      - uri: https://github.com/kunpengcompute/KAE/blob/kae2/README.md
        revision: kae2 mutable branch; pin an immutable commit before implementation
  kunpeng_accelerator_engine.kunpeng_high_performance_rsa_engine:
    name: Kunpeng High Performance RSA Engine
    description: Kunpeng High Performance RSA Engine (kHPRE)；鲲鹏高性能RSA加速引擎。
    technology: kunpeng_accelerator_engine
    kind: hardware_unit
    sources:
      - uri: https://github.com/kunpengcompute/KAE/blob/kae2/README.md
        revision: kae2 mutable branch; pin an immutable commit before implementation
  kunpeng_accelerator_engine.kunpeng_hardware_acceleration_compression_engine:
    name: Kunpeng Hardware Acceleration Compression Engine
    description: Kunpeng Hardware Acceleration Compression Engine (kZIP)；鲲鹏硬件加速压缩引擎；不反推ZIP展开。
    technology: kunpeng_accelerator_engine
    kind: hardware_unit
    sources:
      - uri: https://github.com/kunpengcompute/KAE/blob/kae2/README.md
        revision: kae2 mutable branch; pin an immutable commit before implementation
scope:
  implementation: Implementation behavior and constraints
  usage: Interface usage and integration
  diagnostics: Failure investigation
  design: Requirements, alternatives, architecture and design constraints
  validation: Tests, experiments, benchmarks and acceptance criteria
  operations: Deployment, monitoring, recovery and service operation
  governance: Engineering rules, decisions, responsibilities and maintenance policy
platforms:
  agnostic: Hardware independent within the stated conditions
  cpu: CPU execution within the stated conditions
  gpu: GPU execution within the stated conditions
  npu: Neural processing unit execution within the stated conditions
tags:
  # 读者任务：至少一个 task.*，可以选择多个；任务不是页面类型。
  task.lookup: Find a definition or contract
  task.design: Select a design
  task.implementation: Implement behavior
  task.debugging: Investigate a failure
  task.optimization: Improve resource use
  task.testing: Verify behavior
  task.migration: Adapt between implementations
  task.learning: Learn a concept or complete a guided learning path
  task.operation: Operate, deploy, monitor or recover a system
  task.evaluation: Compare evidence, methods, results and limitations
  task.security_review: Assess security properties and mitigations
  task.decision: Understand or document a choice and its consequences
