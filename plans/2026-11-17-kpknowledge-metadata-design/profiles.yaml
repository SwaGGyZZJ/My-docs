# 设计稿 v2，未接入运行时。required 是额外元数据字段，requirements 是正文内容与证据契约。
# module 分类与 profile 独立；guidance 保留写作建议，不代替结构与证据检查。
# 结构和引用检查不能证明结论真实、操作已执行、版本兼容或决策获准。
version: kpbot.governance/v2-design
profiles:
  concept:
    type: Concept
    required: [platforms]
    requirements:
      required_roles:
        - definition
        - scope
      evidence_roles:
        - definition
      context_schema:
        type: object
        required: []
        properties: {}
        additionalProperties: false
      conditional: []
    guidance:
      purpose: 解释概念、原理、理论模型及适用前提。
      chip_examples: [ISA内存模型与微架构实现的区别, MMIO与DMA的概念边界]
      terminology_examples:
        [UnifiedBus互联语义, Unified Bus Virtual Address地址模型]
      body_sections: [定义与范围, 前提与假设, 原理解释, 边界与反例, 来源]
      evidence_requirements:
        - 关键解释关联原生证据，区分来源定义、实现事实和作者推断。
        - 芯片架构规范中的承诺与特定IP或实片的行为分开，不跨型号推断。
        - UnifiedBus与Unified Buffer分别解释，不能因都缩写为UB就合并概念或证据。
      avoid_when: 主要查询接口参数、执行操作步骤或记录一项决定。
  api:
    type: API
    required: [platforms]
    requirements:
      required_roles:
        - interface
        - constraints
        - scope
      evidence_roles:
        - interface
        - constraints
      context_schema:
        type: object
        required:
          - interface_id
        properties:
          interface_id:
            type: string
            minLength: 1
        additionalProperties: false
      conditional: []
    guidance:
      purpose: 描述 API、ABI、CLI 或 SDK 的调用契约。
      chip_examples:
        [驱动ioctl与固件mailbox接口, MMIO寄存器访问契约, SDK与算子调用契约]
      terminology_examples:
        [
          Unified Remote Memory Access接口,
          User Space Accelerator Development Kit接口,
          Kunpeng Math Library接口,
        ]
      body_sections:
        [接口与版本, 输入与输出, 前后置条件, 错误与限制, 示例, 来源]
      evidence_requirements:
        - 签名、参数和错误语义关联固定版本的定义、实现或规范。
        - 契约陈述与测试结果分开，未执行示例不得声称验证通过。
        - 固件ABI、寄存器位域、访问宽度、时序与错误条件关联精确接口或手册条款。
        - 记录完整组件名称和接口版本，缩写相同不证明ABI兼容或接口等价。
      avoid_when: 主要描述内部调用过程或完整学习路径。
  guide:
    type: Guide
    required: [platforms]
    requirements:
      required_roles:
        - prerequisites
        - procedure
        - success_criteria
        - verification
      evidence_roles:
        - procedure
      context_schema:
        type: object
        required:
          - verification_state
        properties:
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 帮助已有基础的使用者完成一项具体任务。
      chip_examples: [板级bring-up步骤, 驱动安装与设备初始化, 芯片勘误规避操作]
      terminology_examples:
        [Kunpeng Math Library配置, Kunpeng Unified Acceleration Framework集成]
      body_sections: [目标, 前置条件, 操作步骤, 成功判据, 失败分支, 来源]
      evidence_requirements:
        - 命令、配置和关键步骤关联来源，明确未验证的环境或步骤。
        - 记录芯片与板卡修订、固件和驱动环境，不从用户手册适用范围推导本机已验证。
      avoid_when: 面向新手教学，或需要应急回滚与升级处置。
  optimization:
    type: Optimization
    required: [platforms]
    requirements:
      required_roles:
        - baseline
        - method
        - environment
        - tradeoffs
      evidence_roles:
        - baseline
        - method
      context_schema:
        type: object
        required:
          - result_state
        properties:
          result_state:
            type: string
            enum:
              - planned
              - reported
              - measured
        additionalProperties: false
      conditional:
        - when:
            field: context.result_state
            equals: planned
          required_status: draft
        - when:
            field: context.result_state
            in:
              - reported
              - measured
          required_roles:
            - results
          evidence_roles:
            - results
        - when:
            field: context.result_state
            equals: measured
          required_roles:
            - measurement_artifacts
          evidence_roles:
            - measurement_artifacts
    guidance:
      purpose: 解释性能、资源或成本优化的机制、收益和代价。
      chip_examples: [缓存与DMA性能优化, 算子访存优化, 芯片PPA权衡]
      terminology_examples:
        [
          Kunpeng Accelerator Engine卸载优化,
          Kunpeng Unified Parallel Library并行优化,
        ]
      body_sections:
        [问题与基线, 环境与负载, 瓶颈证据, 优化方法, 结果与代价, 适用限制, 来源]
      evidence_requirements:
        - 数值结论关联原始结果、基线、工具与环境，预期收益和实测收益分开。
        - 未实测的方案标为草稿，标签或来源版本不代替适用条件。
        - 仿真估计、实现工具报告与实片测量分开，保留约束、角点与负载条件。
      avoid_when: 主要比较实验方法和多组结果，而不是解释一项优化。
  runbook:
    type: Runbook
    required: [platforms]
    requirements:
      required_roles:
        - trigger
        - prerequisites
        - procedure
        - checkpoints
        - recovery
        - verification
      evidence_roles:
        - procedure
        - recovery
      context_schema:
        type: object
        required:
          - verification_state
        properties:
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 支持运维、发布、回滚、灾备与事件处置。
      chip_examples: [固件升级与恢复, 板卡上电检查, 驱动与设备故障处置]
      terminology_examples:
        [
          UnifiedBus Management故障处置,
          virtual Kunpeng Accelerator Engine部署检查,
        ]
      body_sections:
        [触发条件, 前置检查与权限, 操作步骤, 检查点, 回滚与恢复, 升级处置, 来源]
      evidence_requirements:
        - 关键操作、检查点与恢复路径有依据，操作说明本身不授予执行权限。
        - 写寄存器、烧录、复位与升级步骤说明前置状态、检查点和已知恢复限制。
      avoid_when: 主要分析根因或面向新手讲解操作原理。
  example:
    type: Example
    required: [platforms]
    requirements:
      required_roles:
        - prerequisites
        - procedure
        - expected_result
        - verification
      evidence_roles:
        - procedure
      context_schema:
        type: object
        required:
          - verification_state
        properties:
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 用最小实例、配方或案例呈现一种做法及其限制。
      chip_examples: [最小寄存器访问示例, 固件接口调用示例, RTL模块使用示例]
      terminology_examples:
        [Unified Remote Memory Access最小调用, Hyper Thread Library线程示例]
      body_sections:
        [场景与前提, 输入, 代码或操作, 预期输出, 验证状态与限制, 来源]
      evidence_requirements:
        - 明确示例是否实际运行，虚构输入输出不当作实测结果。
        - 分清模拟器、FPGA原型与实片环境，不把示意地址或位域当成真实器件定义。
      avoid_when: 主要结论来自系统实验，或需要完整任务流程。
  glossary:
    type: Glossary
    required: []
    requirements:
      required_roles:
        - terminology
        - definition
      evidence_roles:
        - terminology
        - definition
      context_schema:
        type: object
        required: []
        properties: {}
        additionalProperties: false
      conditional: []
    guidance:
      purpose: 解释术语、缩写、单位、同义词与歧义。
      chip_examples: [芯片与SoC及IP术语, ISA与微架构术语, BSP与固件及驱动术语]
      terminology_examples:
        [
          Kunpeng Accelerator Engine正式名称,
          UB Processing Unit与UB Bus Controller的区别,
        ]
      body_sections: [术语与定义, 别名, 区别与边界, 来源]
      evidence_requirements:
        - 关键定义有来源，搜索别名不等于稳定身份别名或词表迁移。
        - 全称为主名，简称附列，保留官方来源、版本与技术范围；全称内含缩写时不自行逐层扩写。
        - HCCS、UMMU、UMDK、URPC等存在不同官方展开时按文档上下文说明，不猜测统一全称。
      avoid_when: 需要长篇机制解释或结构化接口契约。
  interoperability:
    type: Interoperability
    required: [platforms, source_technology, target_technology]
    requirements:
      required_roles:
        - mapping
        - compatibility_limits
        - verification
      evidence_roles:
        - mapping
        - compatibility_limits
      context_schema:
        type: object
        required:
          - verification_state
        properties:
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 解释不同技术之间的兼容、移植、迁移和行为映射。
      chip_examples: [HDL或编程技术间的接口迁移, 跨技术软硬件接口映射]
      terminology_examples:
        - UnifiedBus与UB over Ethernet的协议边界与映射
        - 不同独立命名通信技术间的迁移；同一技术的模块关系用api或mechanism描述
      body_sections:
        [源与目标, 行为差异, 映射与迁移步骤, 验证方法, 回退, 适用限制, 来源]
      evidence_requirements:
        - 源和目标必须是不同的已登记技术，兼容性结论绑定各自依据与条件。
        - 不以芯片型号或版本冒充source_technology与target_technology，同技术版本变更可用change描述。
        - 驱动与固件配套、板卡与芯片修订等组合条件单独保留，不能由迁移标签推出兼容。
      avoid_when: 只列一项技术的接口，或只描述补丁前后的变更。
  architecture:
    type: Architecture
    required: [platforms]
    requirements:
      required_roles:
        - scope
        - components
        - relationships
        - design_state
      evidence_roles:
        - components
        - relationships
      context_schema:
        type: object
        required:
          - description_state
        properties:
          description_state:
            type: string
            enum:
              - current
              - proposed
              - mixed
        additionalProperties: false
      conditional: []
    guidance:
      purpose: 描述系统边界、组件职责、依赖、部署与关键关系。
      chip_examples: [SoC与IP互连架构, 芯片与板级集成, 驱动与固件及运行时架构]
      terminology_examples:
        [UnifiedBus互联与通信组件架构, Kunpeng Accelerator Engine软硬件边界]
      body_sections:
        [
          范围与版本,
          组件与职责,
          关系与数据流,
          约束与质量属性,
          现状与设计边界,
          来源,
        ]
      evidence_requirements:
        - 组件和关系关联固定来源，当前实现与目标设计明确区分。
        - 区分ISA、微架构、RTL设计、物理实现和板级系统，设计说明不自动证明实物实现。
      avoid_when: 主要解释细粒度执行链，或记录为何选择某项架构。
  mechanism:
    type: Mechanism
    required: [platforms]
    requirements:
      required_roles:
        - entry
        - execution
        - invariants
      evidence_roles:
        - entry
        - execution
      context_schema:
        type: object
        required: []
        properties: {}
        additionalProperties: false
      conditional: []
    guidance:
      purpose: 解释算法、数据结构、控制流、状态机或资源生命周期如何工作。
      chip_examples:
        [驱动装载固件的调用链, DMA与中断时序, 复位与启动状态机, RTL跨时钟域机制]
      terminology_examples:
        [
          UB Bus Controller运行机制,
          Kunpeng Hardware Acceleration Compression Engine卸载机制,
        ]
      body_sections:
        [入口与范围, 状态或调用过程, 不变量与前提, 失败路径与反例, 来源]
      evidence_requirements:
        - 因果链关联源码、规范或原生证据定位，推断与直接陈述分开。
        - 缺少失败路径证据时明确未知，不为填章节编造结论。
        - 寄存器、时序、状态转移与软硬件边界对应源码或手册定位，跨层页可多选object标签。
      avoid_when: 主要列接口定义，或指导使用者执行操作。
  reference:
    type: Reference
    required: [platforms]
    requirements:
      required_roles:
        - interface
        - constraints
        - scope
      evidence_roles:
        - interface
        - constraints
      context_schema:
        type: object
        required:
          - reference_id
        properties:
          reference_id:
            type: string
            minLength: 1
        additionalProperties: false
      conditional: []
    guidance:
      purpose: 提供数据、协议、配置、规范、需求或工程资产的结构化查阅资料。
      chip_examples:
        [寄存器与位域参考, 芯片接口与电气约束, 用户手册中的参数与配置条目]
      terminology_examples:
        [UnifiedBus Root Table字段, Kunpeng Math Library接口参考]
      body_sections:
        [对象与版本, 条目与结构, 约束与默认值, 兼容与限制, 相关资源, 来源]
      evidence_requirements:
        - 规范要求和观察事实分开，优先引用原生 schema、协议、清单或制品。
        - 数据集与模型资料保留来源、用途与局限，不能只保留一个性能分数。
        - 数据手册、参考手册、寄存器手册与用户手册保留原版本和章节，不把来源类别当页面profile。
        - 组件全称和简称关联官方材料；官方产品名没有独立展开时保留原名，不自造英文名称。
      avoid_when: 主要解释运行因果、教学或实验结果。
  tutorial:
    type: Tutorial
    required: [platforms]
    requirements:
      required_roles:
        - learning_goal
        - prerequisites
        - procedure
        - milestones
        - verification
      evidence_roles:
        - procedure
      context_schema:
        type: object
        required:
          - verification_state
        properties:
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 引导新手通过一条完整路径获得知识和操作经验。
      chip_examples: [开发板入门与首次运行, SDK与算子入门, RTL仿真入门]
      terminology_examples:
        [Kunpeng Math Library入门, User Space Accelerator Development Kit入门]
      body_sections:
        [学习目标, 起点与环境, 引导步骤, 阶段检查, 完成结果, 后续学习, 来源]
      evidence_requirements:
        - 明确演示路径的前提和验证状态，区分教学输出与实际执行记录。
        - 指明开发板、芯片与工具环境，模拟环境的成功不等于实片操作成功。
      avoid_when: 使用者已有基础，只需完成一项日常任务。
  troubleshooting:
    type: Troubleshooting
    required: [platforms]
    requirements:
      required_roles:
        - symptoms
        - environment
        - diagnosis
        - cause
        - remedy
        - verification
      evidence_roles:
        - symptoms
        - diagnosis
      context_schema:
        type: object
        required:
          - cause_state
          - verification_state
        properties:
          cause_state:
            type: string
            enum:
              - unknown
              - hypothesis
              - confirmed
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.cause_state
            equals: confirmed
          evidence_roles:
            - cause
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 整理缺陷、故障诊断、事故复盘、失败模式与负面经验。
      chip_examples:
        [芯片勘误及软件规避, 固件与驱动版本不匹配, 板级上电与时钟故障]
      terminology_examples:
        [
          Unified Remote Memory Access建链故障,
          Kunpeng Accelerator Engine卸载失败,
        ]
      body_sections:
        [
          症状与影响,
          环境与复现,
          鉴别过程,
          根因与推断,
          修复或规避,
          验证与预防,
          来源,
        ]
      evidence_requirements:
        - 观察、根因推断、修复效果分别绑定证据，无法复现或未验证需明确说明。
        - 保留失败尝试与反例，不将单次经验直接推广为普遍规律。
        - 勘误记录受影响型号或stepping、触发条件与规避依据，区分芯片缺陷、驱动缺陷和配置问题。
      avoid_when: 主要提供应急操作清单，或解释一个正常工作机制。
  change:
    type: Change
    required: [platforms]
    requirements:
      required_roles:
        - before
        - after
        - impact
        - verification
      evidence_roles:
        - before
        - after
      context_schema:
        type: object
        required:
          - change_kind
          - before_version
          - after_version
          - verification_state
        properties:
          change_kind:
            type: string
            enum:
              - code_diff
              - interface_revision
              - design_revision
              - release
          before_version:
            type: string
            minLength: 1
          after_version:
            type: string
            minLength: 1
          base:
            type: string
            minLength: 1
          head:
            type: string
            minLength: 1
          verification_state:
            type: string
            enum:
              - not_run
              - source_reported
              - locally_verified
        additionalProperties: false
      conditional:
        - when:
            field: context.change_kind
            equals: code_diff
          required_context:
            - base
            - head
          required_roles:
            - diff
          evidence_roles:
            - diff
          required_source_roles:
            - diff
            - metadata
          evidence_source_roles:
            diff:
              - diff
        - when:
            field: context.verification_state
            equals: locally_verified
          required_roles:
            - environment
            - results
            - measurement_artifacts
          evidence_roles:
            - results
            - measurement_artifacts
        - when:
            field: context.verification_state
            equals: source_reported
          required_roles:
            - results
          evidence_roles:
            - results
    guidance:
      purpose: 解释 PR、补丁、提交、发布与废弃带来的行为变化。
      chip_examples:
        [驱动补丁与固件ABI变更, RTL设计修订, 芯片勘误或发布说明中的行为变化]
      terminology_examples:
        [
          Kunpeng Accelerator Engine模块变更,
          Unified Remote Memory Access接口变更,
        ]
      body_sections:
        [背景与范围, 变更前后, 机制变化, 影响与兼容性, 验证状态, 来源]
      evidence_requirements:
        - PR或补丁保留原生 base、head、diff 与元数据依据，作者说法和实现变化分开。
        - 合入、测试通过、进入发行包和上线是不同事实，不能互相推断。
        - 芯片设计修订、实片stepping、固件与驱动发行版本是不同对象的变化，逐项绑定证据。
        - 名称表述差异不自动解释为产品改名或协议升级，改名关系需独立来源支持。
      avoid_when: 主要描述当前实现全貌，或记录尚待裁决的方案。
  decision:
    type: Decision
    required: [platforms]
    requirements:
      required_roles:
        - problem
        - alternatives
        - decision
      evidence_roles:
        - problem
      context_schema:
        type: object
        required:
          - decision_state
        properties:
          decision_state:
            type: string
            enum:
              - proposed
              - accepted
              - rejected
              - superseded
        additionalProperties: false
      conditional:
        - when:
            field: context.decision_state
            in:
              - accepted
              - rejected
              - superseded
          required_roles:
            - decision_record
          evidence_roles:
            - decision_record
    guidance:
      purpose: 保留 ADR、RFC、需求取舍、会议决定及其理由与后果。
      chip_examples:
        [芯片PPA方案选择, IP集成取舍, 软硬件职责划分, 寄存器接口设计决定]
      terminology_examples:
        [
          选用Kunpeng Unified Parallel Library的取舍,
          选用UnifiedBus通信技术的取舍,
        ]
      body_sections:
        [问题与约束, 候选方案, 决策与状态, 理由与后果, 替代关系与待决项, 来源]
      evidence_requirements:
        - 决策状态放在正文，区分提议、已接受、被否决和被替代，不混入页面status。
        - 决策和决定者来自已登记材料，讨论记录不自动等于已批准决定。
        - 保留设计约束、被否决方案与预期后果，不把已接受设计等同于已实现或实片验证。
      avoid_when: 主要描述当前事实，或只提供没有取舍的流程步骤。
  evaluation:
    type: Evaluation
    required: [platforms]
    requirements:
      required_roles:
        - problem
        - method
        - environment
        - limitations
      evidence_roles:
        - method
      context_schema:
        type: object
        required:
          - result_state
        properties:
          result_state:
            type: string
            enum:
              - planned
              - reported
              - measured
        additionalProperties: false
      conditional:
        - when:
            field: context.result_state
            equals: planned
          required_status: draft
        - when:
            field: context.result_state
            in:
              - reported
              - measured
          required_roles:
            - results
          evidence_roles:
            - results
        - when:
            field: context.result_state
            equals: measured
          required_roles:
            - measurement_artifacts
          evidence_roles:
            - measurement_artifacts
    guidance:
      purpose: 组织测试、基准、研究、模型或数据评估的方法与结果。
      chip_examples:
        [RTL仿真与形式验证, DFT与芯片测试, FPGA原型与实片测试, 时序与PPA评估]
      terminology_examples:
        [
          Hyper Message Passing Interface性能评估,
          Kunpeng Math Library数值与性能评估,
        ]
      body_sections:
        [
          问题与假设,
          方法与数据,
          环境与版本,
          基线与指标,
          结果或计划,
          局限与反例,
          来源,
        ]
      evidence_requirements:
        - 结果关联原始制品、指标定义和环境，来源转述与独立复现分开。
        - 无结果的实验计划保持草稿，测试通过不自动证明所有语义主张正确。
        - 分开记录仿真、形式验证、FPGA原型、实现工具分析和实片测量，注明约束与环境。
        - 用完整组件名称、实际版本与环境标识评估对象，不把同缩写结果自动汇总为同一产品。
      avoid_when: 主要解释单项优化机制，或只描述模型与数据结构。
requirements_contract:
  schema: kpknowledge.profile-requirements/v1
  status: design-only
  body_fence: kpknowledge-contract
  body_schema:
    type: object
    required:
      - schema
      - profile
      - subjects
      - context
      - sections
    properties:
      schema:
        type: string
        enum:
          - kpknowledge.body-contract/v1
      profile:
        type: string
        minLength: 1
      subjects:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - name
            - source_refs
          properties:
            name:
              type: string
              minLength: 1
            source_refs:
              type: array
              uniqueItems: true
              items:
                type: object
                required:
                  - resource
                  - version
                  - role
                properties:
                  resource:
                    type: string
                    minLength: 1
                  version:
                    type: string
                    minLength: 1
                  role:
                    type: string
                    enum:
                      - primary
                      - supporting
                      - body
                      - diff
                      - metadata
                additionalProperties: false
          additionalProperties: false
      context:
        type: object
      sections:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - role
            - anchor
            - evidence
          properties:
            role:
              type: string
              minLength: 1
            anchor:
              type: string
              minLength: 1
            evidence:
              type: array
              uniqueItems: true
              items:
                type: object
                required:
                  - resource
                  - version
                  - role
                properties:
                  resource:
                    type: string
                    minLength: 1
                  version:
                    type: string
                    minLength: 1
                  role:
                    type: string
                    enum:
                      - primary
                      - supporting
                      - body
                      - diff
                      - metadata
                additionalProperties: false
          additionalProperties: false
    additionalProperties: false
  role_definitions:
    definition: 定义及与相邻概念的边界
    scope: 描述范围、版本前提与限制
    interface: 接口或参考对象的稳定标识及契约
    constraints: 输入输出、错误、默认值或适用约束
    prerequisites: 环境、依赖与操作前提
    procedure: 有顺序的步骤或最小操作实例
    success_criteria: 可观察的完成或成功判据
    verification: 验证状态、方法及尚未验证的部分
    baseline: 可识别的比较基线及其限制
    method: 方法、负载、输入与度量方式
    environment: 实际工具、软硬件、版本与约束环境
    tradeoffs: 收益、代价与适用限制
    trigger: 何种观察或条件触发处置
    checkpoints: 操作前后检查点
    recovery: 回滚、恢复或升级路径及其边界
    expected_result: 预期输出及其与实测输出的区别
    terminology: 完整主名、简称与来源定义
    mapping: 来源技术到目标技术的映射与差异
    compatibility_limits: 已知兼容范围、未覆盖行为与限制
    components: 组件职责、边界与标识
    relationships: 有依据的连接、依赖或数据流
    design_state: 目标设计与已有实现的区分
    entry: 机制入口、初始状态与适用前提
    execution: 控制流、状态转换或资源生命周期
    invariants: 关键不变量、假设与失败边界
    learning_goal: 学习目标与起点
    milestones: 阶段检查与完成结果
    symptoms: 观察到的症状和影响
    diagnosis: 诊断过程、鉴别依据与未排除因素
    cause: 已确认根因或明确标记的根因推断
    remedy: 修复、规避或尚未解决的状态
    before: 变更前的行为与可识别版本
    after: 变更后的行为与可识别版本
    impact: 影响范围、兼容性与交付状态
    problem: 问题、目标与约束
    alternatives: 候选方案及取舍
    decision: 决策内容、状态及后果
    limitations: 方法、结果与外推的限制
    results: 带有指标定义的观察或转述结果
    measurement_artifacts: 本地实测的原始制品与运行记录
    decision_record: 记录决策状态的原始材料
    diff: 原生代码差异与定位
  rules:
    enforce_required_on:
      - stable
      - deprecated
    draft_missing_requirements: warning
    draft_present_values: validate_shape_and_references
    required_block_count: 1
    profile_binding: body.profile equals frontmatter.profile
    subject_binding: Each subject needs at least one exact frontmatter sources tuple when required rules are enforced
    section_binding: Unique role and unique anchor; anchor resolves to one explicit HTML id and nonempty prose outside the contract block
    evidence_binding: Every evidence tuple must exactly match a frontmatter sources tuple; required evidence roles need at least one tuple
    allowed_roles: Only required_roles, evidence_roles, or roles named in this profile conditional rules
    conditional_evaluation: Union effects of all matching rules; required_status always enforced when the field is present, including drafts
    context_binding: context is validated against the selected profile context_schema; conditional required_context refers to its properties
    module_binding: Each module token resolves in registries.module and its technology occurs in frontmatter.technology
    module_parent_binding: parent, if present, resolves to a module with the same technology; reject cycles; prefixes carry no inferred relationship
    interoperability_binding:
      Both endpoint technologies occur in frontmatter.technology and differ; same-technology module mappings
      use api/mechanism/change as appropriate
    scope_of_checks: Structure and exact references only; evidence sufficiency, truth, approval and test execution require independent review
    anchor_format:
      HTML id is an ASCII letter followed by letters, digits, underscores or hyphens; match exact case, not
      renderer-generated heading slugs
    module_extension:
      Add a reviewed module entry conforming to module_entry_schema; a new registration does not change the
      frontmatter field shape or existing page classification
    requirements_presence:
      stable/deprecated require one body contract; draft may omit it. If present, its structural schema and exact
      references are always checked. Missing subject evidence, profile context required fields, required sections or their
      evidence are warnings for draft and errors otherwise.
    evidence_source_roles:
      For each named section and requested source role, at least one evidence tuple of that source role must occur in that
      section; source role constraints do not prove semantic support
  module_entry_schema:
    type: object
    required:
      - name
      - description
      - technology
      - kind
      - sources
    properties:
      name:
        type: string
        minLength: 1
      description:
        type: string
        minLength: 1
      technology:
        type: string
        minLength: 1
      kind:
        type: string
        enum:
          - software_component
          - hardware_unit
          - bridge
          - subsystem
          - library
          - driver
          - firmware
          - tool
      parent:
        type: string
        minLength: 1
      sources:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - uri
            - revision
          properties:
            uri:
              type: string
              minLength: 1
            revision:
              type: string
              minLength: 1
          additionalProperties: false
    additionalProperties: false
