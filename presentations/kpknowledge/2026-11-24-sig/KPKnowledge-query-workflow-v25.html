ype":"kernel","version":null}],"complete":false},"status":"completed"},{"time":"16:28:01","partId":"prt_1edc51f8f001AyovnEB2jXW1Kz","messageId":"msg_1edc4fe29001DptADMQy1nD3In","kind":"tool","tool":"kpbot-knowledge_kpbot_knowledge_read","input":{"endLine":123,"startLine":87,"ticket":"T03"},"output":{"schema":"kpbot.unified-read/v1","catalogDigest":"47a83bfa06facc5abcd7b8ebcde443e3a399b589af310cc9a1ff653f2221d1ec","identity":{"type":"code","sourceId":"repo-3dc72d55b57679acafef76ab621abe6b","outputVersion":"06c45427917f1a7ce0e2388997ffbce12490fb7a134fd7f9c5449cf673f43bff","sourceRevision":"f9e68f92fab0db37f02728671da3048f4ffefb9ade03b95e70ec71cb2123b3f3","canonicalSourceUri":"urn:kpbot:code:repo-3dc72d55b57679acafef76ab621abe6b","repositoryId":"kunpeng-document-wiki","knowledgeId":"kpi_eca5c795-0bf9-4aef-aa28-e4437ba28a66","pageRevision":"94d1009edee05a99a46e937dd76b279d3df345ba1b1691aaad3408c971aae75d"},"targetKind":"page","repositoryPath":"knowledge/code-wiki/ucx/workflows/connection-wireup.md","logicalPath":"kpbot/workflows/connection-wireup.md","status":{"contentLint":"not-checked","governanceStatus":"not-checked","machineValidity":"valid","humanReview":"unreviewed","activation":"inactive","nativeReview":"not-recorded","applicability":{"state":"unknown","reasons":["APPLICABILITY_ASSERTION_MISSING"],"schemaVersion":"kpbot.applicability/v1","headDigest":null,"assertionRevision":null,"vocabularyDigest":null,"expression":null},"freshness":"current"},"content":"## 机制二：lane 选择评分\n\n`ucp_wireup_select_lanes` 是入口（`repo://src/ucp/wireup/select.c#L2971-L3001`）：先尝试\"可扩展 TL 位图\"，失败则回退全量 TL 位图重选。\n\n每个 lane 类型（AM/RMA/AMO/TAG/CM/…，词汇见[协议选择框架](../concepts/protocol-selection.md)）各自有添加函数（`ucp_wireup_add_cm_lane`/`add_rma_lanes`/`add_amo_lanes` 等，`repo://src/ucp/wireup/select.c#L1228-L1313`，汇总调用见 `repo://src/ucp/wireup/select.c#L2647-L2659`）。核心选择函数 `ucp_wireup_select_transport` 按**准则（criteria）+ 评分**工作（`repo://src/ucp/wireup/select.c#L431-L514`）：\n\n- **准则**：本地/远端 iface 能力位、MD 注册能力、原子标志逐项校验，不满足者直接淘汰；\n- **评分**：以\"代价\"倒数排序。RMA 评分公式为 `1e-3 / (延迟 + overhead + 4096/带宽)`——注释明确\"以 4 KiB 消息最优\"为目标（`repo://src/ucp/wireup/select.c#L1122-L1131`）；同类公式见各 lane 类型（`repo://src/ucp/wireup/select.c#L1154`、`#L1305`、`#L1364`）；\n- **带宽对称性**：取 `min(本地带宽, 远端带宽)`；V2 地址用 FP8 有损压缩，本地带宽同样做 pack/unpack 往返保证对称计算（`repo://src/ucp/wireup/select.c#L1097-L1114`）；\n- **并列消解**：分数相近（容差内）的候选按 tiebreak 二次择优（`repo://src/ucp/wireup/select.c#L375-L392`）。\n\n## 机制三：wireup 代理端点与自举\n\nlane 选好后需要\"在不依赖对方端点存在的情况下\"与之建立 UCT 连接——鸡生蛋问题由**代理端点** `ucp_wireup_ep_t` 解决（`repo://src/ucp/wireup/wireup_ep.c#L25-L61`）：\n\n- 代理持有 `aux_ep`（辅助路径）与 `next_ep`（正式端点）；`ucp_wireup_ep_get_msg_ep` 在正式端点就绪前返回 `aux_ep`，就绪后返回正式端点（`repo://src/ucp/wireup/wireup_ep.c#L79-L93`）；`aux_ep == NULL` 即正式端点已激活（`repo://src/ucp/wireup/wireup_ep.c#L55-L58`）。\n- `ucp_wireup_connect_remote` 把 lane 替换为 wireup 代理，并把原 UCT 端点上的 pending 请求迁移到临时队列，避免它们阻塞 wireup 消息发送；注释明确\"wired up ep 应把现有 am_lane 用作 next_ep\"（`repo://src/ucp/wireup/wireup.c#L2161-L2200`）。\n- 协议消息流：`UCP_WIREUP_MSG_PRE_REQUEST/REQUEST/REPLY/ACK`（`repo://src/ucp/wireup/wireup.c#L64-L68`、`repo://src/ucp/wireup/wireup.c#L213-L217`），即先经辅助/CM 路径协商出正式端点地址，再逐 lane `connect_to_ep`，最后切换 `next_ep` 并重放 pending 请求（重放与协议重选的配合见[协议选择框架](../concepts/protocol-selection.md)）。\n\n**服务端匹配**：客户端连接请求到达时，`ep_match`（基于 UCS conn_match 抽象，`repo://src/ucp/wireup/ep_match.c#L25-L48`）按远端 UUID 与连接序号匹配已有端点或创建新端点（插入逻辑在 `repo://src/ucp/wireup/wireup.c#L708` 附近），匹配成功后两个方向端点对接（ep_to_ep）。\n\n## 机制四：CM 连接管理路径\n\nsockaddr 客户端-服务端场景走 CM（`src/ucp/wireup/wireup_cm.c`）：客户端在 CM 上创建 sockaddr UCT 端点（`repo://src/ucp/wireup/wireup_cm.c#L82`），连接私有数据携带打包的 wireup 载荷（尺寸按版本自适应，`repo://src/ucp/wireup/wireup_cm.c#L228-L258`）；服务端由 listener 交付 conn_request 后走同一 wireup 消息流。CM 只负责把\"两个陌生端点\"互相介绍，介绍完成后数据走正式 lane。UCP 侧 CM lane 的选择同机制二（`ucp_wireup_add_cm_lane`）。\n\n## 不变量与前提\n\n- lane 选择的输入是**双方**能力：本地 iface/MD 属性 + 远端地址中申报的能力，任何一侧不满足准则即淘汰。\n- 评分对称性：FP8 压缩字段本地同样往返，保证两端算出可比的分数（`repo://src/ucp/wireup/select.c#L1097-L1114`）。\n- wireup 期间数据消息不会丢：pending 请求被迁移并在连接完成后重放（`repo://src/ucp/wireup/wireup.c#L2161-L2200`）。\n\n## 失败路径与反例\n\n- 可扩展 TL 位图选择失败：静默回退全量位图重选，仅按分数挑最优（`repo://src/ucp/wireup/select.c#L2987-L3001`）。\n- 准则不满足（缺能力位/原子标志）：候选被淘汰并汇总缺失标志（`repo://src/ucp/wireup/select.c#L483-L514`）。\n- 连接期间端点已连接/失败/已是代理：`ucp_wireup_connect_remote` 持锁复查后直接返回（`repo://src/ucp/wireup/wireup.c#L2168-L2176`）。\n\n","fileSha256":"70e792c3851e2be055862fca86271b3fd868424fb74d27bdcab0b21782445478","contentSha256":"25bf7934d82a907c1bbcf291e94ad5d78fd4cc6df2279641b06fec042f5a01da","span":{"startLine":87,"endLine":123,"byteStart":13594,"byteEnd":18092,"empty":false},"sources":[{"byteCount":31,"startLine":1,"endLine":1,"provenance":{"resource":"repo://src/ucp/wireup/address.c#L122-L122","version":"repo-lines-v1:sha256:98e9994b7cf75d4300e5eb87782917ef2350879db25df6acea20806c935dad43:eyJzZWxlY3RlZExpbmVDb3VudCI6MSwiZmlyc3RTZWxlY3RlZExpbmVIYXNoIjoiOThlOTk5NGI3Y2Y3NWQ0MzAwZTVlYjg3NzgyOTE3ZWYyMzUwODc5ZGIyNWRmNmFjZWEyMDgwNmM5MzVkYWQ0MyIsImxhc3RTZWxlY3RlZExpbmVIYXNoIjoiOThlOTk5NGI3Y2Y3NWQ0MzAwZTVlYjg3NzgyOTE3ZWYyMzUwODc5ZGIyNWRmNmFjZWEyMDgwNmM5MzVkYWQ0MyIsInByZWNlZGluZ0NvbnRleHRMaW5lQ291bnQiOjMsInByZWNlZGluZ0NvbnRleHRIYXNoIjoiMjIyYzUxNGFjODYwMTg5YjRjMGYzY2M1ZTQ0MzFlYTFlODBjOGM1NjI3OWVhYzYwZWYxNzU3NTFkOTNiZjlhNiIsImZvbGxvd2luZ0NvbnRleHRMaW5lQ291bnQiOjMsImZvbGxvd2luZ0NvbnRleHRIYXNoIjoiOTM4MmVhNzUzYmUzMDY1ZGVkM2E2ODUwMzBhNzBjYTVjMjVkMjg1ODE5MTAyYzY4NjQ0NzM4ZGM3N2NlYTZkYyJ9","contentSha256":"98e9994b7cf75d4300e5eb87782917ef2350879db25df6acea20806c935dad43","requiredSourceId":"7f734887ebd7ba5bfe5b355fffa33f9f8238e020fdfcd09ddaee205f40352971"},"readTicket":"T06"},{"byteCount":504,"startLine":1,"endLine":13,"provenance":{"resource":"repo://src/ucp/wireup/address.c#L280-L292","version":"repo-lines-v1:sha256:d57ada595ce526ac371225d2cdeb6e7cc592f9a7b7acaaec5263beb7d191bd00:eyJzZWxlY3RlZExpbmVDb3VudCI6MTMsImZpcnN0U2VsZWN0ZWRMaW5lSGFzaCI6ImRjZTIzYjcyZTMxMTFhYjAyM2M0NWU5MjNlYzk1NjBlYTdmMmY1MGEzZWM1ODRhMGEzYjA3MzE4ZTE1NDRhY2IiLCJsYXN0U2VsZWN0 wireup 代理端点 ucp_wireup_ep_t\n│     ├─ aux_ep  = 辅助路径（UD 传输——无需预建连即可发）\n│     └─ next_ep = 正式 RC 端点（占位，尚未就绪）\n│     原 lane 上的 pending 请求迁移到临时队列，避免阻塞握手消息\n│     (wireup.c#L2161-L2200)\n│\n├─ ④ 线上握手消息流（走 aux/CM 路径）\n│     PRE_REQUEST → REQUEST → REPLY → ACK   (wireup.c#L64-L68)\n│     REQUEST 携带本端各 lane 的 UCT 端点地址（IB QPN 等）\n│     服务端 ep_match 按 (远端UUID, 连接序号) 匹配/建端点 (ep_match.c#L25-L48)\n│\n├─ ⑤ 逐 lane connect_to_ep：两端互相绑定对端 RC 地址\n│\n└─ ⑥ 切换：aux_ep 置 NULL，next_ep 激活为正式端点\n      迁移的 pending 请求重放（此时才真正发出）\n      协议选择阈值表在此 lane 配置上固化\n```\n\n### 关键设计点\n\n| 点 | 说明 | 证据 |\n|---|---|---|\n| **代理端点双态** | `aux_ep==NULL` 即正式端点激活；消息路由 `get_msg_ep` 在两态间切换 | `wireup_ep.c#L55-L93` |\n| **握手期间数据不丢** | 先到的数据请求进 pending 临时队列，建链完成后重放 | `wireup.c#L2161-L2200` |\n| **带宽取双边最小** | `min(本地,远端)`，FP8 有损压缩两端对称往返保证评分可比 | `select.c#L1097-L1114` |\n| **sockaddr 场景** | 走 CM（rdmacm/TCP），连接私有数据携带 wireup 载荷，CM 只做“介绍人” | `wireup_cm.c#L82-L258` |\n| **失败回退** | 可扩展 TL 位图选择失败→静默回退全量位图重选 | `select.c#L2987-L3001` |\n\n**一句话**：`MPI_Init` 时交换 worker 地址 → 首次通信触发 lane 评分（选出 rc_mlx5 等）→ 握手消息先走免连接的辅助路径（UD）自举出正式 RC 连接 → 切换正式 lane 并重放积压请求。此后的 eager/rndv 分档（上一问）都在这条建好的 lane 上进行。\n\n注意：地址交换这一步的带外通道（MPI modex 还是 TCP rendezvous）属 OpenMPI 侧实现，UCX 仓内证据止于“地址如何打包”（`address.c`），不规定交换方式。"}],"answer":"基于知识库 [连接建立与 lane 选择] 页（实读核实，`actualReadEvidence: true`）回答。\n\n## 建链流程（wireup）：MPI 通信开始前的握手\n\n**核心矛盾**：IB 的 RC 传输要“先有对端 QPN 地址才能连接”，但对端地址要通过通信才能拿到——鸡生蛋。UCP 用**代理端点 + 辅助路径自举**解决。\n\n### 全流程时序（MPI_Init 阶段 / 首次通信触发）\n\n```\n┌─ ① 地址交换（带外：MPI 启动器/modex 交换，非 UCX 线上流量）\n│     ucp_address_pack: worker UUID + 按设备分组的每 iface 属性\n│     （带宽/延迟/能力位，FP8 压缩，带版本号，repo://src/ucp/wireup/address.c#L122-L136）\n│\n├─ ② 首次 ucp_ep_create / 首条发送 → 触发 wireup\n│     ucp_wireup_select_lanes (select.c#L2971)\n│     ├─ 准则淘汰：本地+远端 iface 能力位、MD 注册能力逐项校验\n│     └─ 评分排序：score = 1e-3/(延迟+overhead+4096/带宽)，4KiB 最优\n│        → 为 AM / RMA / AMO / TAG / CM 各选出 lane（IB 上典型 = rc_mlx5/rc_verbs）\n│\n├─ ③ 自举：lane 先挂 wireup 代理端点 ucp_wireup_ep_t\n│     ├─ aux_ep  = 辅助路径
