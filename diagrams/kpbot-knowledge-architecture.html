<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPBot Knowledge · 架构与通路实现计划</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; background: #f5f7fb; }
    main { flex: 1 1 0; width: 100%; min-width: 0; min-height: 0; overflow: auto; }
    figure { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; margin: 0; }
    figure[hidden] { display: none; }
    img { display: block; flex: none; max-width: none; max-height: none; }
    nav { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 16px; padding: 8px 16px 12px; background: #f5f7fb; }
    .control-group { display: flex; align-items: center; gap: 12px; }
    button { width: 40px; height: 36px; border: 1px solid #cbd5e1; border-radius: 9px; background: #fff; color: #183153; font-size: 21px; cursor: pointer; }
    button:hover:not(:disabled) { background: #e8eef8; border-color: #8fa8cd; }
    button:disabled { opacity: .35; cursor: default; }
    button:focus-visible { outline: 3px solid #2872d1; outline-offset: 2px; }
    output { min-width: 48px; text-align: center; color: #53647a; font-size: 13px; font-variant-numeric: tabular-nums; }
    #fit { width: 56px; font-size: 13px; }
  </style>
</head>
<body>
  <main aria-label="KPBot Knowledge 图示">
    <figure data-page="architecture">
      <img src="./kpbot-knowledge/kpbot-knowledge-architecture.svg" alt="KPBot Knowledge 架构图" data-width="1600" data-height="1560" draggable="false">
    </figure>
    <figure data-page="plan" hidden>
      <img src="./kpbot-knowledge/kpbot-knowledge-planning-map.svg" alt="KPBot Knowledge 通路实现计划图" data-width="1600" data-height="1360" draggable="false">
    </figure>
  </main>
  <nav aria-label="图示翻页">
    <div class="control-group">
      <button type="button" id="previous" aria-label="上一页" title="上一页（←）">←</button>
      <output id="counter" aria-live="polite"></output>
      <button type="button" id="next" aria-label="下一页" title="下一页（→）">→</button>
    </div>
    <div class="control-group">
      <button type="button" id="zoom-out" aria-label="缩小" title="缩小（-）">−</button>
      <button type="button" id="fit" title="适配屏幕（0）">适配</button>
      <button type="button" id="zoom-in" aria-label="放大" title="放大（+）">+</button>
      <output id="zoom-value" aria-live="polite"></output>
    </div>
  </nav>
  <script>
    const pages = Array.from(document.querySelectorAll("figure[data-page]"));
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const counter = document.getElementById("counter");
    const stage = document.querySelector("main");
    const zoomOut = document.getElementById("zoom-out");
    const zoomIn = document.getElementById("zoom-in");
    const fit = document.getElementById("fit");
    const zoomValue = document.getElementById("zoom-value");
    let current = 0;
    let zoom = 1;

    function layoutPage() {
      const page = pages[current];
      const img = page.querySelector("img");
      const scale = Math.min(stage.clientWidth / Number(img.dataset.width), stage.clientHeight / Number(img.dataset.height));
      const width = Math.max(1, Math.floor(Number(img.dataset.width) * scale * zoom));
      const height = Math.max(1, Math.floor(Number(img.dataset.height) * scale * zoom));
      page.style.width = Math.max(stage.clientWidth, width) + "px";
      page.style.height = Math.max(stage.clientHeight, height) + "px";
      img.style.width = width + "px";
      img.style.height = height + "px";
      stage.scrollLeft = Math.max(0, (page.clientWidth - stage.clientWidth) / 2);
      stage.scrollTop = Math.max(0, (page.clientHeight - stage.clientHeight) / 2);
      zoomOut.disabled = zoom <= 0.5;
      zoomIn.disabled = zoom >= 3;
      zoomValue.textContent = Math.round(zoom * 100) + "%";
    }

    function setZoom(value) {
      zoom = Math.max(0.5, Math.min(3, value));
      layoutPage();
    }

    function showPage(index) {
      current = Math.max(0, Math.min(index, pages.length - 1));
      pages.forEach((page, i) => { page.hidden = i !== current; });
      previous.disabled = current === 0;
      next.disabled = current === pages.length - 1;
      counter.textContent = (current + 1) + " / " + pages.length;
      zoom = 1;
      layoutPage();
      history.replaceState(null, "", "#" + pages[current].dataset.page);
    }

    previous.addEventListener("click", () => showPage(current - 1));
    next.addEventListener("click", () => showPage(current + 1));
    zoomOut.addEventListener("click", () => setZoom(zoom - 0.25));
    zoomIn.addEventListener("click", () => setZoom(zoom + 0.25));
    fit.addEventListener("click", () => setZoom(1));
    window.addEventListener("resize", layoutPage);
    document.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        showPage(current + 1);
      } else if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        showPage(current - 1);
      } else if (event.key === "Home") {
        showPage(0);
      } else if (event.key === "End") {
        showPage(pages.length - 1);
      } else if (event.key === "+" || event.key === "=") {
        setZoom(zoom + 0.25);
      } else if (event.key === "-") {
        setZoom(zoom - 0.25);
      } else if (event.key === "0") {
        setZoom(1);
      }
    });
    let touchStartX = null;
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0]?.screenX ?? null;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const distance = event.changedTouches[0].screenX - touchStartX;
      if (Math.abs(distance) > 60) showPage(current + (distance < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });
    window.addEventListener("hashchange", () => {
      const index = pages.findIndex((page) => "#" + page.dataset.page === location.hash);
      if (index >= 0) showPage(index);
    });
    const initial = pages.findIndex((page) => "#" + page.dataset.page === location.hash);
    showPage(initial >= 0 ? initial : 0);
  </script>
</body>
</html>
