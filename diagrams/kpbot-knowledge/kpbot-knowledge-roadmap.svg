ont-size="21" font-weight="700" text-anchor="start">简易查询网页</text><text x="854" y="458" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">搜索、查看知识卡和来源</text><rect x="840" y="525" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="854" y="561" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">远程调用验证</text><text x="854" y="590" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">留存查询 trace，检查版本切换</text><rect x="840" y="667" width="314" height="55" rx="10" fill="#ece6ff" stroke="#ece6ff" stroke-width="1"/><text x="853" y="691" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="start">验收：MCP 与网页查到同一快照</text><line x1="1176" y1="447" x2="1202" y2="447" stroke="#8297b1" stroke-width="3"/><path d="M1202 447 l-10 -7 v14 z" fill="#8297b1"/><rect x="1206" y="143" width="350" height="598" rx="15" fill="#fff" stroke="#d7e0eb" stroke-width="1.5"/><rect x="1206" y="143" width="350" height="91" rx="15" fill="#def2e5" stroke="#def2e5" stroke-width="1.5"/><text x="1228" y="181" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="start">后续阶段 ②</text><text x="1228" y="215" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" text-anchor="start">P2 · MCP 验证后</text><rect x="1224" y="261" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="1238" y="297" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">服务器部署</text><text x="1238" y="326" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">配置可访问的服务、HTTPS</text><text x="1238" y="351" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">和访问控制</text><rect x="1224" y="393" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="1238" y="429" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">发布运维</text><text x="1238" y="458" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">验证远程查询、版本切换与回退</text><rect x="1224" y="525" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="1238" y="561" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">运行证据</text><text x="1238" y="590" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">保留部署配置和最小故障排查记录</text><rect x="1224" y="667" width="314" height="55" rx="10" fill="#def2e5" stroke="#def2e5" stroke-width="1"/><text x="1237" y="691" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" text-anchor="start">验收：远程服务可查询、可回退</text><rect x="54" y="773" width="1502" height="73" rx="13" fill="#edf1f6" stroke="#edf1f6" stroke-width="1"/><text x="76" y="803" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="start">排期边界</text><text x="76" y="832" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" text-anchor="start">前四周是两个双周周期；后续阶段不预设周数。跨阶段验收通过后再启动依赖项。</text>
