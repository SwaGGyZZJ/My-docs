<text x="54" y="65" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" font-weight="700" text-anchor="start">KPBot Knowledge · 通路路标</text><text x="54" y="103" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="400" text-anchor="start">先完成知识迁移对照，再固化 Wiki Skill；MCP 与服务器按验收结果顺序接入。</text><rect x="54" y="143" width="350" height="598" rx="15" fill="#fff" stroke="#d7e0eb" stroke-width="1.5"/><rect x="54" y="143" width="350" height="91" rx="15" fill="#ffe8d7" stroke="#ffe8d7" stroke-width="1.5"/><text x="76" y="181" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="start">第 1 个双周</text><text x="76" y="215" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" text-anchor="start">W1–W2 · P0 先行通路</text><rect x="72" y="261" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="86" y="297" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">迁移与效果</text><text x="86" y="326" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">旧 refs → 已审 OKF；原入口回接；</text><text x="86" y="351" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">同任务 A/B 运行</text><rect x="72" y="393" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="86" y="429" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-a