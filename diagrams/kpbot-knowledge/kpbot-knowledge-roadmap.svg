" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="470" y="297" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">三类 Wiki 闭环</text><text x="470" y="326" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">PR、文档完成创建、更新、查询；</text><text x="470" y="351" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">汇总 A/B 对照结论</text><rect x="456" y="393" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="470" y="429" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">统一入口</text><text x="470" y="458" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">创建、更新、查询三个 Skill；</text><text x="470" y="483" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">个人 Wiki 本地试用</text><rect x="456" y="525" width="314" height="113" rx="10" fill="#fff" stroke="#d7e0eb" stroke-width="1"/><text x="470" y="561" fill="#17283f" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" text-anchor="start">维护与门禁</text><text x="470" y="590" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="400" text-anchor="start">digest、审核、发布、回退；</text><text x="470" y="615" fill="#56677b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weigh